name: Buffer delivery monitor (read only)
on:
  # 2026-11-03: Buffer API の24時間の上限に当たったため、30分ごと＋記事処理のたび（1日 約90回×約9回の呼び出し）から
  # 4時間ごと（1日6回）に減らした。予約の呼び出しを優先する（scripts/buffer_budget.py）
  schedule:
    - cron: '12 */4 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: buffer-delivery-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Read Buffer delivery and check upcoming images
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          # 他の処理の呼び出し回数・429 の待ち時間（state/buffer_calls/）を読み、上限が近ければ確認を見送る（この記録は保存しない）
          BUFFER_LEDGER: monitor
          BUFFER_DAILY_CAP: ${{ vars.BUFFER_DAILY_CAP }}
          BUFFER_MONITOR_CAP: ${{ vars.BUFFER_MONITOR_CAP }}
        run: python scripts/buffer_delivery_monitor.py
