name: Candidate health monitor
on:
  schedule:
    - cron: '17 * * * *'
  # Scheduled Actions can be delayed or skipped. Article generation is also
  # started by the watchdog, so each completion provides a backup trigger.
  workflow_run:
    workflows: ['Auto Article Pipeline']
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  issues: write
concurrency:
  group: candidate-health
  cancel-in-progress: false
jobs:
  check:
    # Only our own normal pipeline may trigger this privileged monitor.
    if: >-
      ${{ github.event_name != 'workflow_run' ||
          (github.event.workflow_run.head_repository.full_name == github.repository &&
           github.event.workflow_run.head_branch == 'main' &&
           contains(fromJSON('["schedule", "workflow_dispatch"]'), github.event.workflow_run.event) &&
           startsWith(github.event.workflow_run.display_title, 'Auto Article Pipeline (')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Check observed candidate counts
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/candidate_health.py
