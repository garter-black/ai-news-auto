name: Hatena blog draft

# はてなブログ「サイソクニュース 解説ノート」へ、その日の主要記事1本の解説を「下書き」で送る（scripts/crosspost_drafts.py）。
# 公開はしない（HATENA_PUBLISH=1 のときだけ公開）。中身はオーナーが確かめてから公開を始める。
on:
  schedule:
    - cron: "20 3 * * *"  # 毎日 12:20 JST
  workflow_dispatch:
    inputs:
      n:
        description: "本数（1〜3）"
        default: "1"

permissions:
  contents: read

concurrency:
  group: hatena-draft
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Write draft and send to Hatena
        env:
          HATENA_ID: ${{ secrets.HATENA_ID }}
          HATENA_BLOG_ID: ${{ secrets.HATENA_BLOG_ID }}
          HATENA_API_KEY: ${{ secrets.HATENA_API_KEY }}
          HATENA_PUBLISH: ${{ vars.HATENA_PUBLISH }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python scripts/crosspost_drafts.py --n "${{ github.event.inputs.n || '1' }}" --hatena
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drafts
          path: out/drafts
          if-no-files-found: ignore
