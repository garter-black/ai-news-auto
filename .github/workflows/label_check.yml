name: Label check proposals

# 公開中の記事のジャンル・企業の札・タグの見直し案を作る（scripts/label_check.py --propose。2026-11-03 の点検 11・台帳 A30）。
# 記事・SNS は一切変えない（SNS への投稿もしない）。案はアーティファクトに置き、人（または作業中のエージェント）が確かめてから
# `python scripts/label_check.py --apply` で記事に当てる。
# Claude API は purpose="helper"（Haiku）。使用量はこのジョブ専用の台帳に記録して push する。
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "見る本数（0 = 公開中の全記事）"
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: label-check
  cancel-in-progress: false

jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: pip install -r requirements.txt
      - run: npm ci --no-audit --no-fund

      - name: Verify label rules without external requests
        run: python -m unittest tests.test_labels && node --test tests/test_company_labels.cjs

      - name: Make proposals (articles are not changed)
        env:
          LLM_WORKFLOW: labels
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_API_MONTHLY_BUDGET_USD: ${{ vars.CLAUDE_API_MONTHLY_BUDGET_USD }}
          CLAUDE_API_UPGRADES: "0"
          CLAUDE_API_LEDGER: labels
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          LIMIT: ${{ inputs.limit }}
        run: |
          mkdir -p work
          node scripts/build_index.mjs
          if [ "${LIMIT:-0}" != "0" ]; then ARGS="--limit $LIMIT"; else ARGS=""; fi
          timeout 1500 python scripts/label_check.py --propose work/label_proposals.json $ARGS

      - name: Save proposals
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: label-proposals
          path: work/label_proposals.json
          if-no-files-found: warn
          retention-days: 14

      - name: Record Claude API usage
        if: always()
        run: |
          git checkout -- content/llm_usage.json 2>/dev/null || true
          git add state/claude_api_usage_labels.json 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(llm): Claude API の使用量を記録（ジャンル・企業の札の見直し案）"
          python3 scripts/git_safe_push.py && exit 0
          echo "::warning::使用量を push できませんでした"
