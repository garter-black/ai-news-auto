name: SNS video v3 (manual)

# SNS 動画 v3「画面で見せる型」（横型 1920x1080）を本番の声（VOICEVOX）で書き出し、Artifacts に置くだけ。投稿はしない。
# 手動実行のみ（スケジュールなし）。各段階の秒数は report.json の timings と、このログの「時間」に出る。
# 速さのために: VOICEVOX は最初に裏で起動（取得と並行）・ブラウザはランナーにある Chrome・日本語フォントは repo の Noto を使う。
on:
  workflow_dispatch:
    inputs:
      slugs:
        description: "記事の slug（スペース区切り）"
        required: true
      speaker:
        description: "VOICEVOX の話者名（2026-11-02 オーナーが選んだ九州そら）"
        default: "九州そら"

permissions:
  contents: write  # Claude API の使用量（state/claude_api_usage_video.json）を main に残すため

concurrency:
  group: shorts-v3-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: VOICEVOX を裏で起動（以降の準備と並行）
        run: |
          echo "JOB_T0=$(date +%s)" >> "$GITHUB_ENV"
          nohup sh -c 'docker run -d --rm --name voicevox -p 50021:50021 voicevox/voicevox_engine:cpu-latest' > /tmp/voicevox.log 2>&1 &
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: 準備（Python・Claude CLI・日本語フォント）
        run: |
          npm i -g @anthropic-ai/claude-code > /tmp/claude-install.log 2>&1 &
          pip install -r requirements.txt numpy pillow budoux opencv-python-headless playwright imageio-ffmpeg
          mkdir -p ~/.local/share/fonts && cp assets/fonts/NotoSansJP-*.otf ~/.local/share/fonts/ && fc-cache -f > /dev/null
          which ffmpeg || echo "ffmpeg はランナーに無いので imageio-ffmpeg を使う"
          google-chrome --version
          wait
          echo "準備: $(( $(date +%s) - JOB_T0 ))秒"
      - name: 書き出し
        env:
          LLM_WORKFLOW: video  # 無料枠の取り分を数えるジョブ名（scripts/llm.py）
          # 2026-11-03: 動画の台本は無料の LLM（Gemini など）を使わない。鍵を渡さない＝記事づくりの無料枠を食わない（Claude API → CLI だけ。無ければ動画なし）
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_DAILY_MAX: ${{ vars.CLAUDE_DAILY_MAX || '40' }}
          CLAUDE_MODEL: opus  # Claude CLI のときの台本のモデル（2026-11-02 オーナー「質を優先」）
          # 動画の台本は目立つもの: Claude API（クレジット。台本 Opus・レビュー Sonnet）→ Claude CLI → 無料モデル（scripts/llm.py）
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_DEFAULT_VISIBILITY: high
          LLM_DEFAULT_PURPOSE: video
          CLAUDE_API_LEDGER: video
          CLAUDE_API_MONTHLY_BUDGET_USD: ${{ vars.CLAUDE_API_MONTHLY_BUDGET_USD }}
          CLAUDE_API_DAILY_CALLS_VIDEO: ${{ vars.CLAUDE_API_DAILY_CALLS_VIDEO }}
          V3_VOICEVOX_SPEAKER: ${{ github.event.inputs.speaker || '九州そら' }}
          SLUGS: ${{ github.event.inputs.slugs }}
        run: |
          set +e
          for slug in $SLUGS; do
            t=$(date +%s)
            python scripts/shorts_v3.py "$slug" --tts voicevox --out out/shorts_v3 --profile production
            # 同じ台本から SNS 用の短い版も（LLM は呼ばない）
            [ -f "out/shorts_v3/$slug.v3script.json" ] && python scripts/shorts_v3.py "$slug" --tts voicevox --out out/shorts_v3 --profile production --short
            echo "時間: $slug $(( $(date +%s) - t ))秒（ジョブ開始から $(( $(date +%s) - JOB_T0 ))秒）"
          done
          docker logs voicevox 2>&1 | tail -3 || true
          python - <<'EOF'
          import json, glob
          for p in sorted(glob.glob("out/shorts_v3/*.report.json")):
              r = json.load(open(p))
              g = r.get("gate", {})
              print(r["slug"], "合格" if g.get("ok") else "不合格", r.get("timings"), g.get("reasons"))
          EOF
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: shorts-v3-${{ github.run_number }}
          path: |
            out/shorts_v3/*.mp4
            out/shorts_v3/*.png
            out/shorts_v3/*.json
          retention-days: 7
      # Claude API の使用量（月の予算の管理）を main に足す。同時に動く回と衝突しないよう、最新の main に足し直して push
      - name: Claude API の使用量を記録
        if: always()
        continue-on-error: true
        run: |
          # Claude API の使用額と、無料モデルの回数（ジョブごとの取り分。scripts/llm.py）
          f=state/claude_api_usage_video.json
          u=state/llm_usage_video.json
          if [ -z "$(git status --porcelain "$f" "$u" 2>/dev/null)" ]; then exit 0; fi
          cp "$f" "$RUNNER_TEMP/api_usage_mine.json" 2>/dev/null || echo '{}' > "$RUNNER_TEMP/api_usage_mine.json"
          cp "$u" "$RUNNER_TEMP/llm_usage_mine.json" 2>/dev/null || echo '{}' > "$RUNNER_TEMP/llm_usage_mine.json"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            git fetch --depth 1 origin main && git reset --hard origin/main
            python scripts/llm.py --merge-api-usage "$RUNNER_TEMP/api_usage_mine.json" "$f"
            python scripts/llm.py --merge-usage-counts "$RUNNER_TEMP/llm_usage_mine.json" "$u"
            git add "$f" "$u"
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "chore(llm): Claude API の使用量を記録（動画）"
            git push origin HEAD:main && exit 0
            sleep 5
          done
