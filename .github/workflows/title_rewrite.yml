name: Title rewrite proposals

# 記事の見出しを報道の書き方に直す「案」を作る（scripts/rewrite_titles.py --propose。2026-11-03 オーナー指摘）。
# 記事・SNS は一切変えない。案はアーティファクトに置き、人（または作業中のエージェント）が確かめてから
# `python scripts/rewrite_titles.py --apply` で少しずつ記事に当てる。
# Claude API は purpose（既定 core = 予算の配分で Sonnet、苦しければ Haiku）。使用量はこのジョブ専用の台帳に記録して push する。
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "案を作る本数（0 = 公開中の全記事）"
        required: false
        default: "0"
      slugs:
        description: "この slug だけ（カンマ区切り。空なら全記事）"
        required: false
        default: ""
      purpose:
        description: "Claude API の段（core = Sonnet 中心 / helper = Haiku）"
        required: false
        default: "core"
      core_cap:
        description: "この回だけの core の1日の呼び出し上限（空なら既定の60。全記事を一度に直すときだけ上げる）"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: title-rewrite
  cancel-in-progress: false

jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Verify headline rules without external requests
        run: python -m unittest tests.test_headline_normalize.StyleGateTest tests.test_headline_normalize.PromptStyleTest

      - name: Make proposals (articles are not changed)
        env:
          LLM_WORKFLOW: titles
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_API_MONTHLY_BUDGET_USD: ${{ vars.CLAUDE_API_MONTHLY_BUDGET_USD }}
          # 余った予算で Opus に上げない（見出しには Sonnet で十分）
          CLAUDE_API_UPGRADES: "0"
          CLAUDE_API_LEDGER: titles
          CLAUDE_API_DAILY_CALLS_CORE: ${{ inputs.core_cap || '60' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LIMIT: ${{ inputs.limit }}
          SLUGS: ${{ inputs.slugs }}
          PURPOSE: ${{ inputs.purpose }}
        run: |
          mkdir -p work
          timeout 2100 python scripts/rewrite_titles.py --propose work/title_proposals.json \
            --limit "${LIMIT:-0}" --slugs "$SLUGS" --purpose "${PURPOSE:-core}"

      - name: Save proposals
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: title-proposals
          path: work/title_proposals.json
          if-no-files-found: warn
          retention-days: 14

      - name: Record Claude API usage
        if: always()
        run: |
          git checkout -- content/llm_usage.json 2>/dev/null || true
          git add state/claude_api_usage_titles.json 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(llm): Claude API の使用量を記録（見出しの書き直し案）"
          python3 scripts/git_safe_push.py && exit 0
          echo "::warning::使用量を push できませんでした"
