name: SNS video tests

# SNS 動画 v3（scripts/shorts_v3.py）と中身に合わせた型（scripts/video_templates.py）・品質ゲート（scripts/video_gate.py）のテスト。
# 合成のページとテスト用の合成音で小さく書き出してゲートに通す（ネット・LLM・VOICEVOX は使わない）。何も投稿しない。
on:
  push:
    branches: [main]
    paths:
      - "scripts/shorts*.py"
      - "scripts/video_*.py"
      - "tests/test_shorts_v3.py"
      - "tests/test_shorts_v3_script.py"
      - "tests/test_video_templates.py"
      - "tests/fixtures/video/**"
      - ".github/workflows/video_tests.yml"
  pull_request:
    paths:
      - "scripts/shorts*.py"
      - "scripts/video_*.py"
      - "tests/test_shorts_v3.py"
      - "tests/test_shorts_v3_script.py"
      - "tests/test_video_templates.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: 準備（ffmpeg・Python）
        run: |
          which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          pip install -r requirements.txt numpy pillow budoux opencv-python-headless
      - name: 動画のテスト（投稿しない）
        run: python -m unittest -v tests.test_video_templates tests.test_shorts_v3 tests.test_shorts_v3_script
